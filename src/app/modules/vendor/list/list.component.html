<div class="px-8 pb-8 pt-2">
   <div class="ops-table">
      <ng-container *ngIf="vendors$ | async as vendors; else noVendors">
         <ng-container *ngIf="vendors.length > 0; else noVendors">
            <table class="min-w-full divide-y divide-gray-200">
               <thead>
                  <tr>
                     <th scope="col"
                        class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider ops-muted">
                        Vendor
                     </th>
                     <th scope="col"
                        class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider ops-muted">
                        Email
                     </th>
                     <th scope="col"
                        class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider ops-muted">
                        Contact No.
                     </th>
                     <th scope="col"
                        class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider ops-muted">
                        City
                     </th>
                     <th scope="col" class="relative px-6 py-3">
                        <span class="sr-only">Edit</span>
                     </th>
                  </tr>
               </thead>
               <tbody class="bg-white divide-y divide-gray-200">
                  <ng-container *ngFor="let vendor of vendors; trackBy: trackByFn">
                     <tr class="cursor-pointer" (click)="openDetail(vendor)">
                        <td class="px-6 py-4 whitespace-nowrap">
                           <div class="text-sm font-medium text-gray-900">
                              {{ vendor?.name | titlecase }}
                           </div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                           <div class="text-sm text-gray-900">
                              {{ vendor.email }}
                           </div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                           <div class="text-sm text-gray-500">
                              {{ vendor.contactNo }}
                           </div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                           <span class="ops-pill ops-pill-neutral">
                              {{ vendor.city | titlecase }}
                           </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                           <button type="button"
                              class="ml-2 inline-flex items-center px-2 py-1 text-sm font-medium text-gray-500 bg-white rounded-xl hover:bg-gray-50 hover:text-gray-900 focus:outline-none"
                              style="border: 1px solid #e8eaee"
                              matTooltip="Edit" [routerLink]="[vendor._id]" (click)="$event.stopPropagation()"
                              *ngIf="canEdit() | async">
                              <mat-icon class="h-4 w-4" svgIcon="feather:edit"></mat-icon>
                           </button>
                        </td>
                     </tr>
                  </ng-container>
                  <tr>
                     <td colspan="5">
                        <mat-paginator class="z-10 dark:bg-transparent"
                           [ngClass]="{ 'pointer-events-none': isLoading }" [length]="pagination.totalData"
                           [pageIndex]="pagination.page" [pageSize]="pagination.limit"
                           [pageSizeOptions]="[5, 10, 25, 100]" [showFirstLastButtons]="true"></mat-paginator>
                     </td>
                  </tr>
               </tbody>
            </table>
         </ng-container>
      </ng-container>
      <ng-template #noVendors>
         <div class="p-10 text-sm text-center ops-muted">
            There are no vendors!
         </div>
      </ng-template>
   </div>
</div>
