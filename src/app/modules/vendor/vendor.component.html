<div class="px-8 pt-6 pb-2">
   <div class="flex flex-wrap items-center justify-between gap-4">
      <div class="flex flex-wrap items-center gap-3 min-w-0 flex-1">
         <mat-form-field class="w-56" style="font-size: small">
            <mat-label>Search</mat-label>
            <input matInput [formControl]="searchCtrl" />
         </mat-form-field>
      </div>
      <div class="flex items-center gap-2">
         <button type="button"
            class="inline-flex items-center px-4 py-2 text-sm font-medium text-white bg-gray-900 hover:bg-gray-800 rounded-xl focus:outline-none"
            [routerLink]="['create']" *ngIf="canCreate() | async">
            <mat-icon class="-ml-1 mr-2 h-5 w-5" svgIcon="heroicons_outline:plus"></mat-icon>
            Create
         </button>
      </div>
   </div>
</div>
<vendor-list></vendor-list>
