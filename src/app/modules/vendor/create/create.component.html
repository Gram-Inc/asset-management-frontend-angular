<div class="px-8 py-6 max-w-3xl" [formGroup]="vendorForm">
  <div class="mb-4">
    <h2 class="text-lg font-semibold text-gray-900 tracking-tight">
      {{ vendor != null || vendor != undefined ? "Update" : "Create" }} vendor
    </h2>
    <p class="ops-muted mt-1">Supplier contact and service details.</p>
  </div>

  <div class="ops-surface p-6 mb-5">
    <h3 class="text-xs font-semibold uppercase tracking-wider ops-muted mb-4">Identity</h3>
    <div class="grid grid-cols-6 gap-5">
      <div class="col-span-6 sm:col-span-3">
        <label class="block text-sm font-medium text-gray-700">Vendor name</label>
        <input type="text" [formControlName]="'name'"
          [class]="vendorForm.controls['name'].invalid && vendorForm.controls['name'].touched ? 'border-red-500' : ''"
          class="mt-1 block w-full sm:text-sm border rounded-xl px-3 py-2 shadow-sm focus:outline-none focus:ring-1 focus:ring-gray-900 focus:border-gray-900"
          style="border-color: #e8eaee" />
      </div>
      <div class="col-span-6 sm:col-span-3">
        <label class="block text-sm font-medium text-gray-700">Email address</label>
        <input type="text" [formControlName]="'email'"
          [class]="vendorForm.controls['email'].invalid && vendorForm.controls['email'].touched ? 'border-red-500' : ''"
          class="mt-1 block w-full sm:text-sm border rounded-xl px-3 py-2 shadow-sm focus:outline-none focus:ring-1 focus:ring-gray-900 focus:border-gray-900"
          style="border-color: #e8eaee" />
      </div>
      <div class="col-span-6 sm:col-span-3">
        <label class="block text-sm font-medium text-gray-700">Contact person</label>
        <input type="text" [formControlName]="'contactPersonName'"
          [class]="vendorForm.controls['contactPersonName'].invalid && vendorForm.controls['contactPersonName'].touched ? 'border-red-500' : ''"
          class="mt-1 block w-full sm:text-sm border rounded-xl px-3 py-2 shadow-sm focus:outline-none focus:ring-1 focus:ring-gray-900 focus:border-gray-900"
          style="border-color: #e8eaee" />
      </div>
      <div class="col-span-6 sm:col-span-3">
        <label class="block text-sm font-medium text-gray-700">Mobile number</label>
        <input type="text" [formControlName]="'contactNo'"
          [class]="vendorForm.controls['contactNo'].invalid && vendorForm.controls['contactNo'].touched ? 'border-red-500' : ''"
          class="mt-1 block w-full sm:text-sm border rounded-xl px-3 py-2 shadow-sm focus:outline-none focus:ring-1 focus:ring-gray-900 focus:border-gray-900"
          style="border-color: #e8eaee" />
      </div>
    </div>
  </div>

  <div class="ops-surface p-6">
    <h3 class="text-xs font-semibold uppercase tracking-wider ops-muted mb-4">Location & service</h3>
    <div class="grid grid-cols-6 gap-5">
      <div class="col-span-6 sm:col-span-2">
        <label class="block text-sm font-medium text-gray-700">Address</label>
        <input type="text" [formControlName]="'address1'"
          [class]="vendorForm.controls['address1'].invalid && vendorForm.controls['address1'].touched ? 'border-red-500' : ''"
          class="mt-1 block w-full sm:text-sm border rounded-xl px-3 py-2 shadow-sm focus:outline-none focus:ring-1 focus:ring-gray-900 focus:border-gray-900"
          style="border-color: #e8eaee" />
      </div>
      <div class="col-span-6 sm:col-span-2">
        <label class="block text-sm font-medium text-gray-700">Address line 1</label>
        <input type="text" [formControlName]="'address2'"
          [class]="vendorForm.controls['address2'].invalid && vendorForm.controls['address2'].touched ? 'border-red-500' : ''"
          class="mt-1 block w-full sm:text-sm border rounded-xl px-3 py-2 shadow-sm focus:outline-none focus:ring-1 focus:ring-gray-900 focus:border-gray-900"
          style="border-color: #e8eaee" />
      </div>
      <div class="col-span-6 sm:col-span-2">
        <label class="block text-sm font-medium text-gray-700">Address line 2</label>
        <input type="text" [formControlName]="'address3'"
          [class]="vendorForm.controls['address3'].invalid && vendorForm.controls['address3'].touched ? 'border-red-500' : ''"
          class="mt-1 block w-full sm:text-sm border rounded-xl px-3 py-2 shadow-sm focus:outline-none focus:ring-1 focus:ring-gray-900 focus:border-gray-900"
          style="border-color: #e8eaee" />
      </div>
      <div class="col-span-6 sm:col-span-3">
        <label class="block text-sm font-medium text-gray-700">City</label>
        <input type="text" [formControlName]="'city'"
          [class]="vendorForm.controls['city'].invalid && vendorForm.controls['city'].touched ? 'border-red-500' : ''"
          class="mt-1 block w-full sm:text-sm border rounded-xl px-3 py-2 shadow-sm focus:outline-none focus:ring-1 focus:ring-gray-900 focus:border-gray-900"
          style="border-color: #e8eaee" />
      </div>
      <div class="col-span-6 sm:col-span-3">
        <label class="block text-sm font-medium text-gray-700">Service No.</label>
        <input type="text" [formControlName]="'serviceNo'"
          [class]="vendorForm.controls['serviceNo'].invalid && vendorForm.controls['serviceNo'].touched ? 'border-red-500' : ''"
          class="mt-1 block w-full sm:text-sm border rounded-xl px-3 py-2 shadow-sm focus:outline-none focus:ring-1 focus:ring-gray-900 focus:border-gray-900"
          style="border-color: #e8eaee" />
      </div>
    </div>
  </div>

  <div class="flex items-center justify-end gap-3 mt-5">
    <button type="button"
      class="inline-flex items-center px-4 py-2 text-sm font-medium text-gray-700 bg-white rounded-xl hover:bg-gray-50 focus:outline-none"
      style="border: 1px solid #e8eaee"
      [routerLink]="['../']">
      Cancel
    </button>
    <button type="button"
      class="inline-flex items-center px-4 py-2 text-sm font-medium text-white bg-gray-900 hover:bg-gray-800 rounded-xl focus:outline-none"
      (click)="create()">
      <mat-icon class="-ml-1 mr-2 h-5 w-5" svgIcon="heroicons_outline:plus"></mat-icon>
      {{ vendor != null || vendor != undefined ? "Update" : "Create" }}
    </button>
  </div>
</div>
