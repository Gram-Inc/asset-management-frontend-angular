<div class="metric">
  <div class="metric-top">
    <span class="metric-label">{{ title }}</span>
    <span class="metric-badge" *ngIf="icon" [ngClass]="color">
      <mat-icon [svgIcon]="icon"></mat-icon>
    </span>
  </div>
  <div class="metric-value" [ngClass]="color">{{ value ?? 0 }}</div>
</div>
