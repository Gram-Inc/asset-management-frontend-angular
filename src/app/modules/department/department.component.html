<div class="px-8 pt-6 pb-2">
   <div class="flex flex-wrap items-center justify-end gap-2">
      <button type="button"
         class="inline-flex items-center px-4 py-2 text-sm font-medium text-white bg-gray-900 hover:bg-gray-800 rounded-xl focus:outline-none"
         [routerLink]="['create']" *ngIf="canCreate() | async">
         <mat-icon class="-ml-1 mr-2 h-5 w-5" svgIcon="heroicons_outline:plus"></mat-icon>
         Create
      </button>
   </div>
</div>
<div class="px-8 pb-8 pt-2">
   <ng-container *ngIf="departments$ | async as departments">
      <ng-container *ngIf="departments.length > 0; else noDepartment">
         <div class="ops-table">
            <table class="min-w-full divide-y divide-gray-200">
               <thead>
                  <tr>
                     <th scope="col"
                        class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider ops-muted">
                        Department
                     </th>
                     <th scope="col"
                        class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider ops-muted">
                        Status
                     </th>
                     <th scope="col" class="relative px-6 py-3">
                        <span class="sr-only">Actions</span>
                     </th>
                  </tr>
               </thead>
               <tbody class="bg-white divide-y divide-gray-200">
                  <tr *ngFor="let department of departments">
                     <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm font-medium text-gray-900">{{ department.name | titlecase }}</div>
                     </td>
                     <td class="px-6 py-4 whitespace-nowrap">
                        <span class="ops-pill"
                           [ngClass]="department.isActive ? 'ops-pill-ok' : 'ops-pill-danger'">
                           {{ department.isActive ? 'Active' : 'Inactive' }}
                        </span>
                     </td>
                     <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                        <button type="button"
                           class="ml-2 inline-flex items-center px-3 py-1.5 text-sm font-medium text-gray-700 bg-white rounded-xl hover:bg-gray-50 focus:outline-none"
                           style="border: 1px solid #e8eaee"
                           [routerLink]="[department._id]" *ngIf="canEdit() | async">
                           Edit
                        </button>
                        <button type="button"
                           class="ml-2 inline-flex items-center px-3 py-1.5 text-sm font-medium text-red-600 bg-white rounded-xl hover:bg-red-50 focus:outline-none"
                           style="border: 1px solid #fecaca"
                           (click)="deleteDepartment(department)" *ngIf="canDelete() | async">
                           Delete
                        </button>
                     </td>
                  </tr>
               </tbody>
            </table>
         </div>
      </ng-container>
   </ng-container>
   <ng-template #noDepartment>
      <div class="ops-surface p-10 text-center ops-muted">No departments</div>
   </ng-template>
</div>
