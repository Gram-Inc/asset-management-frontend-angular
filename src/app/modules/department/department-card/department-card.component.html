<div class="ops-surface overflow-hidden">
   <div class="px-5 py-4 lg:flex lg:items-center lg:justify-between">
      <div>
         <h3 class="text-base font-semibold text-gray-900">{{ department.name | titlecase }}</h3>
      </div>
      <div class="flex gap-2 mt-3 lg:mt-0">
         <button type="button"
            class="inline-flex items-center px-3 py-1.5 text-sm font-medium text-gray-700 bg-white rounded-xl hover:bg-gray-50 focus:outline-none"
            style="border: 1px solid #e8eaee"
            [routerLink]="[department._id]" *ngIf="canEdit() | async">
            Edit
         </button>
         <button type="button"
            class="inline-flex items-center px-3 py-1.5 text-sm font-medium text-red-600 bg-white rounded-xl hover:bg-red-50 focus:outline-none"
            style="border: 1px solid #fecaca"
            (click)="deleteDepartment()" *ngIf="canDelete() | async">
            Delete
         </button>
      </div>
   </div>
   <div class="border-t" style="border-color: #f0f1f4">
      <dl>
         <div class="px-5 py-4 sm:grid sm:grid-cols-3 sm:gap-4" style="background: #fafbfc">
            <dt class="text-sm ops-muted">Department name</dt>
            <dd class="mt-1 text-sm text-gray-900 sm:mt-0 sm:col-span-2">{{ department.name | titlecase }}</dd>
         </div>
         <div class="px-5 py-4 sm:grid sm:grid-cols-3 sm:gap-4">
            <dt class="text-sm ops-muted">Status</dt>
            <dd class="mt-1 sm:mt-0 sm:col-span-2">
               <span class="ops-pill" [ngClass]="department.isActive ? 'ops-pill-ok' : 'ops-pill-danger'">
                  {{ department.isActive ? 'Active' : 'Inactive' }}
               </span>
            </dd>
         </div>
      </dl>
   </div>
</div>
