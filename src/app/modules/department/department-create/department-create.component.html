<div class="px-8 py-6 max-w-xl" [formGroup]="departmentForm">
  <div class="mb-4">
    <h2 class="text-lg font-semibold text-gray-900 tracking-tight">
      {{ this.department ? "Update" : "Create" }} department
    </h2>
    <p class="ops-muted mt-1">Name the organizational unit.</p>
  </div>

  <div class="ops-surface p-6">
    <div class="grid grid-cols-1 gap-5">
      <div>
        <label class="block text-sm font-medium text-gray-700">Department Name</label>
        <input type="text" [formControlName]="'name'"
          [class]="departmentForm.controls['name'].invalid && departmentForm.controls['name'].touched ? 'border-red-500' : ''"
          class="mt-1 block w-full sm:text-sm border rounded-xl px-3 py-2 shadow-sm focus:outline-none focus:ring-1 focus:ring-gray-900 focus:border-gray-900"
          style="border-color: #e8eaee" />
        <span *ngIf="departmentForm.controls['name'].invalid && (departmentForm.controls['name'].dirty || departmentForm.controls['name'].touched)"
          class="text-xs text-red-700">*Required.</span>
      </div>
    </div>
  </div>

  <div class="flex items-center justify-end gap-3 mt-5">
    <button type="button"
      class="inline-flex items-center px-4 py-2 text-sm font-medium text-gray-700 bg-white rounded-xl hover:bg-gray-50 focus:outline-none"
      style="border: 1px solid #e8eaee"
      [routerLink]="['../']">
      Cancel
    </button>
    <button type="button"
      class="inline-flex items-center px-4 py-2 text-sm font-medium text-white bg-gray-900 hover:bg-gray-800 rounded-xl focus:outline-none"
      (click)="create()">
      <mat-icon class="-ml-1 mr-2 h-5 w-5" svgIcon="heroicons_outline:plus"></mat-icon>
      {{ this.department ? "Update" : "Create" }}
    </button>
  </div>
</div>
