<div class="px-8 pt-6 pb-2">
   <div class="flex flex-wrap items-center justify-end gap-2">
      <button type="button"
         class="inline-flex items-center px-4 py-2 text-sm font-medium text-white bg-gray-900 hover:bg-gray-800 rounded-xl focus:outline-none"
         [routerLink]="['create']" *ngIf="canCreate() | async">
         <mat-icon class="-ml-1 mr-2 h-5 w-5" svgIcon="heroicons_outline:plus"></mat-icon>
         Create
      </button>
   </div>
</div>
<div class="px-8 pb-8 pt-2">
   <ng-container *ngIf="branchs$ | async as branchs">
      <ng-container *ngIf="branchs.length > 0; else noBranch">
         <div class="ops-table">
            <table class="min-w-full divide-y divide-gray-200">
               <thead>
                  <tr>
                     <th scope="col"
                        class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider ops-muted">
                        Branch
                     </th>
                     <th scope="col"
                        class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider ops-muted">
                        Code
                     </th>
                     <th scope="col"
                        class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider ops-muted">
                        City
                     </th>
                     <th scope="col"
                        class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider ops-muted">
                        Users
                     </th>
                     <th scope="col"
                        class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider ops-muted">
                        Assets
                     </th>
                     <th scope="col" class="relative px-6 py-3">
                        <span class="sr-only">Edit</span>
                     </th>
                  </tr>
               </thead>
               <tbody class="bg-white divide-y divide-gray-200">
                  <tr *ngFor="let branch of branchs">
                     <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm font-medium text-gray-900">{{ branch.name | titlecase }}</div>
                        <div class="text-xs ops-muted" *ngIf="branch?.fqdn">{{ branch.fqdn }}</div>
                     </td>
                     <td class="px-6 py-4 whitespace-nowrap">
                        <span class="ops-pill ops-pill-neutral">{{ branch?.branchCode }}</span>
                     </td>
                     <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        {{ branch?.city | titlecase }}
                     </td>
                     <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                        {{ branch?.userCount ?? 0 }}
                     </td>
                     <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                        {{ branch?.assetCount ?? 0 }}
                     </td>
                     <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                        <button type="button"
                           class="inline-flex items-center px-3 py-1.5 text-sm font-medium text-gray-700 bg-white rounded-xl hover:bg-gray-50 focus:outline-none"
                           style="border: 1px solid #e8eaee"
                           [routerLink]="[branch._id]" *ngIf="canEdit() | async">
                           Edit
                        </button>
                     </td>
                  </tr>
               </tbody>
            </table>
         </div>
      </ng-container>
   </ng-container>
   <ng-template #noBranch>
      <div class="ops-surface p-10 text-center ops-muted">No branches</div>
   </ng-template>
</div>
