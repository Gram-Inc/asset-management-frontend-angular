<div class="px-8 py-6 max-w-3xl" [formGroup]="branchForm">
  <div class="mb-4">
    <h2 class="text-lg font-semibold text-gray-900 tracking-tight">
      {{ this.branch ? "Update" : "Create" }} branch
    </h2>
    <p class="ops-muted mt-1">Location and network details for this site.</p>
  </div>

  <div class="ops-surface p-6">
    <div class="grid grid-cols-6 gap-5">
      <div class="col-span-6 sm:col-span-4">
        <label class="block text-sm font-medium text-gray-700">Branch Name</label>
        <input type="text" [formControlName]="'name'"
          [class]="branchForm.controls['name'].invalid && branchForm.controls['name'].touched ? 'border-red-500' : ''"
          class="mt-1 block w-full sm:text-sm border rounded-xl px-3 py-2 shadow-sm focus:outline-none focus:ring-1 focus:ring-gray-900 focus:border-gray-900"
          style="border-color: #e8eaee" />
        <span *ngIf="branchForm.controls['name'].invalid && (branchForm.controls['name'].dirty || branchForm.controls['name'].touched)"
          class="text-xs text-red-700">*Required.</span>
      </div>

      <div class="col-span-3 sm:col-span-1">
        <label class="block text-sm font-medium text-gray-700">Branch Code</label>
        <input type="text" [formControlName]="'branchCode'"
          [class]="branchForm.controls['branchCode'].invalid && branchForm.controls['branchCode'].touched ? 'border-red-500' : ''"
          class="mt-1 block w-full sm:text-sm border rounded-xl px-3 py-2 shadow-sm focus:outline-none focus:ring-1 focus:ring-gray-900 focus:border-gray-900"
          style="border-color: #e8eaee" />
        <span *ngIf="branchForm.controls['branchCode'].invalid && (branchForm.controls['branchCode'].dirty || branchForm.controls['branchCode'].touched)"
          class="text-xs text-red-700">*Required.</span>
      </div>

      <div class="col-span-3 sm:col-span-1">
        <label class="block text-sm font-medium text-gray-700">FQDN</label>
        <input type="text" [formControlName]="'fqdn'"
          [class]="branchForm.controls['fqdn'].invalid && branchForm.controls['fqdn'].touched ? 'border-red-500' : ''"
          class="mt-1 block w-full sm:text-sm border rounded-xl px-3 py-2 shadow-sm focus:outline-none focus:ring-1 focus:ring-gray-900 focus:border-gray-900"
          style="border-color: #e8eaee" />
        <span *ngIf="branchForm.controls['fqdn'].invalid && (branchForm.controls['fqdn'].dirty || branchForm.controls['fqdn'].touched)"
          class="text-xs text-red-700">*Invalid.</span>
      </div>

      <div class="col-span-6">
        <label class="block text-sm font-medium text-gray-700">Address Line 1</label>
        <input type="text" [formControlName]="'address1'"
          [class]="branchForm.controls['address1'].invalid && branchForm.controls['address1'].touched ? 'border-red-500' : ''"
          class="mt-1 block w-full sm:text-sm border rounded-xl px-3 py-2 shadow-sm focus:outline-none focus:ring-1 focus:ring-gray-900 focus:border-gray-900"
          style="border-color: #e8eaee" />
        <span *ngIf="branchForm.controls['address1'].invalid && (branchForm.controls['address1'].dirty || branchForm.controls['address1'].touched)"
          class="text-xs text-red-700">*Required.</span>
      </div>

      <div class="col-span-6">
        <label class="block text-sm font-medium text-gray-700">Address Line 2</label>
        <input type="text" [formControlName]="'address2'"
          [class]="branchForm.controls['address2'].invalid && branchForm.controls['address2'].touched ? 'border-red-500' : ''"
          class="mt-1 block w-full sm:text-sm border rounded-xl px-3 py-2 shadow-sm focus:outline-none focus:ring-1 focus:ring-gray-900 focus:border-gray-900"
          style="border-color: #e8eaee" />
        <span *ngIf="branchForm.controls['address2'].invalid && (branchForm.controls['address2'].dirty || branchForm.controls['address2'].touched)"
          class="text-xs text-red-700">*Required.</span>
      </div>

      <div class="col-span-6">
        <label class="block text-sm font-medium text-gray-700">Address Line 3</label>
        <input type="text" [formControlName]="'address3'"
          [class]="branchForm.controls['address3'].invalid && branchForm.controls['address3'].touched ? 'border-red-500' : ''"
          class="mt-1 block w-full sm:text-sm border rounded-xl px-3 py-2 shadow-sm focus:outline-none focus:ring-1 focus:ring-gray-900 focus:border-gray-900"
          style="border-color: #e8eaee" />
        <span *ngIf="branchForm.controls['address3'].invalid && (branchForm.controls['address3'].dirty || branchForm.controls['address3'].touched)"
          class="text-xs text-red-700">*Required.</span>
      </div>

      <div class="col-span-2">
        <label class="block text-sm font-medium text-gray-700">City</label>
        <input type="text" [formControlName]="'city'"
          [class]="branchForm.controls['city'].invalid && branchForm.controls['city'].touched ? 'border-red-500' : ''"
          class="mt-1 block w-full sm:text-sm border rounded-xl px-3 py-2 shadow-sm focus:outline-none focus:ring-1 focus:ring-gray-900 focus:border-gray-900"
          style="border-color: #e8eaee" />
        <span *ngIf="branchForm.controls['city'].invalid && (branchForm.controls['city'].dirty || branchForm.controls['city'].touched)"
          class="text-xs text-red-700">*Required.</span>
      </div>

      <div class="col-span-2">
        <label class="block text-sm font-medium text-gray-700">State</label>
        <input type="text" [formControlName]="'state'"
          [class]="branchForm.controls['state'].invalid && branchForm.controls['state'].touched ? 'border-red-500' : ''"
          class="mt-1 block w-full sm:text-sm border rounded-xl px-3 py-2 shadow-sm focus:outline-none focus:ring-1 focus:ring-gray-900 focus:border-gray-900"
          style="border-color: #e8eaee" />
        <span *ngIf="branchForm.controls['state'].invalid && (branchForm.controls['state'].dirty || branchForm.controls['state'].touched)"
          class="text-xs text-red-700">*Required.</span>
      </div>

      <div class="col-span-2">
        <label class="block text-sm font-medium text-gray-700">Country</label>
        <input type="text" [formControlName]="'country'"
          [class]="branchForm.controls['country'].invalid && branchForm.controls['country'].touched ? 'border-red-500' : ''"
          class="mt-1 block w-full sm:text-sm border rounded-xl px-3 py-2 shadow-sm focus:outline-none focus:ring-1 focus:ring-gray-900 focus:border-gray-900"
          style="border-color: #e8eaee" />
        <span *ngIf="branchForm.controls['country'].invalid && (branchForm.controls['country'].dirty || branchForm.controls['country'].touched)"
          class="text-xs text-red-700">*Required.</span>
      </div>
    </div>
  </div>

  <div class="flex items-center justify-end gap-3 mt-5">
    <button type="button"
      class="inline-flex items-center px-4 py-2 text-sm font-medium text-gray-700 bg-white rounded-xl hover:bg-gray-50 focus:outline-none"
      style="border: 1px solid #e8eaee"
      [routerLink]="['../']">
      Cancel
    </button>
    <button type="button"
      class="inline-flex items-center px-4 py-2 text-sm font-medium text-white bg-gray-900 hover:bg-gray-800 rounded-xl focus:outline-none"
      (click)="create()">
      <mat-icon class="-ml-1 mr-2 h-5 w-5" svgIcon="heroicons_outline:plus"></mat-icon>
      {{ this.branch ? "Update" : "Create" }}
    </button>
  </div>
</div>
