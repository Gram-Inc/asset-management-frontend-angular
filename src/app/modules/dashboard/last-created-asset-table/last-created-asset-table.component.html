<div class="panel">
  <h2>Recent assets</h2>
  <div class="list">
    <ng-container *ngFor="let asset of data.lastTenCreatedAssetsDetails; trackBy: trackByFn">
      <a
        class="row"
        [routerLink]="['/asset/' + asset._id ?? '']"
      >
        <div class="row-copy">
          <div class="row-title">{{ asset.hostName }}</div>
          <div class="row-meta">
            <span *ngIf="asset.createdAt">{{ asset.createdAt | date }}</span>
            <span *ngIf="asset.serialNo">{{ asset.serialNo }}</span>
          </div>
        </div>
        <mat-icon
          class="row-chevron"
          [svgIcon]="'heroicons_solid:chevron-right'"
        ></mat-icon>
      </a>
    </ng-container>
  </div>
</div>
