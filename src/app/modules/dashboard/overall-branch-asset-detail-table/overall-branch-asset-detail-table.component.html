<div class="panel">
  <h2>Branch allocation</h2>
  <div class="table-wrap">
    <table
      mat-table
      [dataSource]="data.branchWiseAssetAllocationAssets"
      class="studio-table"
    >
      <ng-container matColumnDef="branchCode" sticky>
        <th mat-header-cell *matHeaderCellDef>Branch</th>
        <td mat-cell *matCellDef="let branch">
          <span class="branch-code">{{ branch.branchCode }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="ASSIGNED">
        <th mat-header-cell *matHeaderCellDef>Assigned</th>
        <td mat-cell *matCellDef="let branch">
          <span class="num">{{ branch.ASSIGNED }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="IN_POOL">
        <th mat-header-cell *matHeaderCellDef>In pool</th>
        <td mat-cell *matCellDef="let branch">
          <span class="num">{{ branch.IN_POOL }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="DOWN">
        <th mat-header-cell *matHeaderCellDef>Down</th>
        <td mat-cell *matCellDef="let branch">
          <span class="num">{{ branch.DOWN }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="SCRAP">
        <th mat-header-cell *matHeaderCellDef>Scrap</th>
        <td mat-cell *matCellDef="let branch">
          <span class="num">{{ branch.SCRAP }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="remainingPercentage">
        <th mat-header-cell *matHeaderCellDef>Working</th>
        <td mat-cell *matCellDef="let branch">
          <span class="working">
            <span
              class="bar"
              [class.bar-low]="getPercentage(branch) < 30"
              [class.bar-mid]="getPercentage(branch) >= 30 && getPercentage(branch) < 80"
              [class.bar-high]="getPercentage(branch) >= 80"
            >
              <span
                class="bar-fill"
                [style.height.%]="getPercentage(branch)"
              ></span>
            </span>
            <span class="num">{{ getPercentage(branch) }}%</span>
          </span>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
</div>
