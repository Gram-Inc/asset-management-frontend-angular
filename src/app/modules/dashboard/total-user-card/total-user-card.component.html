<div class="panel">
  <h2>User distribution</h2>
  <div class="chart">
    <apx-chart
      class="chart-body"
      [chart]="chartUserDistribution.chart"
      [labels]="chartUserDistribution.labels"
      [legend]="chartUserDistribution.legend"
      [plotOptions]="chartUserDistribution.plotOptions"
      [states]="chartUserDistribution.states"
      [stroke]="chartUserDistribution.stroke"
      [theme]="chartUserDistribution.theme"
      [tooltip]="chartUserDistribution.tooltip"
      [yaxis]="chartUserDistribution.yaxis"
      [series]="chartUserDistribution.series"
    ></apx-chart>
  </div>
  <div class="stats">
    <div class="stat">
      <div class="stat-val">—</div>
      <div class="stat-label">New users</div>
    </div>
    <div class="stat">
      <div class="stat-val">{{ data.totalUsers ?? "—" }}</div>
      <div class="stat-label">Total users</div>
    </div>
  </div>
</div>
