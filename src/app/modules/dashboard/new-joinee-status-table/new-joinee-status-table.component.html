<div class="panel">
  <h2>New joiners</h2>
  <div class="table-wrap">
    <table
      class="studio-table"
      mat-table
      matSort
      [dataSource]="recentTransactionsDataSource"
      [trackBy]="trackByFn"
      #recentTransactionsTable
    >
      <ng-container matColumnDef="date">
        <th mat-header-cell mat-sort-header *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let newJoinee">
          <span class="cell-plain">{{ newJoinee.createdAt | date: "MMM dd, y" }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell mat-sort-header *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let newJoinee">
          <span class="cell-name">{{ newJoinee.firstName + " " + newJoinee.lastName }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell mat-sort-header *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let newJoinee">
          <span
            class="ops-pill"
            [ngClass]="newJoinee.isAssetAllocated ? 'ops-pill-ok' : 'ops-pill-warn'"
          >
            {{ newJoinee.isAssetAllocated ? "Allocated" : "Pending" }}
          </span>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="recentTransactionsTableColumns; sticky: true"></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: recentTransactionsTableColumns"
      ></tr>
    </table>
  </div>
</div>
