<div class="px-8 pt-6 pb-2">
   <div class="flex flex-wrap items-center gap-3 justify-between">
      <div class="flex flex-wrap items-center gap-3 flex-1 min-w-0">
         <span class="hidden sm:block">
            <app-asset-filter></app-asset-filter>
         </span>
         <span class="hidden sm:block flex-1 max-w-xs">
            <mat-form-field class="w-full">
               <mat-label>Search</mat-label>
               <input matInput [formControl]="searchCtrl" />
            </mat-form-field>
         </span>
      </div>
      <div class="flex flex-wrap items-center gap-2">
         <button type="button"
            class="inline-flex items-center px-4 py-2.5 text-sm font-medium text-[#111827] bg-white border border-[#e8eaee] rounded-xl hover:bg-[#f8f9fb] focus:outline-none"
            *ngIf="canExport() | async" (click)="exportCsv()">
            <mat-icon class="-ml-1 mr-2 h-5 w-5 text-gray-500" svgIcon="feather:download-cloud"></mat-icon>
            Export
         </button>
         <button type="button"
            class="inline-flex items-center px-4 py-2.5 text-sm font-medium text-white bg-[#111827] rounded-xl hover:bg-black focus:outline-none"
            [routerLink]="['create']" *ngIf="canCreateAsset() | async">
            <mat-icon class="-ml-1 mr-2 h-5 w-5" svgIcon="heroicons_outline:plus"></mat-icon>
            Create
         </button>
      </div>
   </div>
</div>
<asset-list></asset-list>
