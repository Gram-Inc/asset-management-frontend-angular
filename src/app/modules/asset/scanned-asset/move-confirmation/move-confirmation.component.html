<div class="text-sm font-sans p-2">
  <h1 mat-dialog-title class="font-sans text-[#111827]">Confirmation</h1>
  <div mat-dialog-content class="font-sans">
    <p class="mb-2 ops-muted">Select the type of asset it is..</p>
    <mat-form-field class="text-sm w-full">
      <mat-label>Type</mat-label>
      <input matInput [(ngModel)]="type" cdkFocusInitial />
    </mat-form-field>
  </div>
  <div mat-dialog-actions>
    <button
      type="button"
      class="inline-flex items-center px-4 py-2.5 text-sm font-medium text-white bg-[#111827] rounded-xl hover:bg-black focus:outline-none"
      [mat-dialog-close]="type"
    >
      Ok
    </button>
  </div>
</div>
