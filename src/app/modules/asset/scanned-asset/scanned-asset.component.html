<div class="px-8 pt-6 pb-2">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <p class="ops-muted m-0">Agent-discovered devices waiting to join the pool</p>
    <button
      type="button"
      class="inline-flex items-center px-4 py-2.5 text-sm font-medium text-[#111827] bg-white border border-[#e8eaee] rounded-xl hover:bg-[#f8f9fb] focus:outline-none"
      (click)="refreshList()"
    >
      <mat-icon class="-ml-1 mr-2 h-5 w-5 text-gray-500" svgIcon="feather:refresh-cw"></mat-icon>
      Refresh
    </button>
  </div>
</div>

<div class="px-6 pb-6">
  <div class="ops-table">
    <table mat-table [dataSource]="scannedAssets$" multiTemplateDataRows class="min-w-full font-sans">
      <ng-container matColumnDef="model">
        <th mat-header-cell *matHeaderCellDef class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Model Name</th>
        <td mat-cell *matCellDef="let element" class="px-6 py-4 text-sm text-[#111827]">{{ element?.system.model }}</td>
      </ng-container>

      <ng-container matColumnDef="serial">
        <th mat-header-cell *matHeaderCellDef class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Serial No.</th>
        <td mat-cell *matCellDef="let element" class="px-6 py-4 text-sm text-gray-500">{{ element?.system.serial }}</td>
      </ng-container>

      <ng-container matColumnDef="hostname">
        <th mat-header-cell *matHeaderCellDef class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Host Name</th>
        <td mat-cell *matCellDef="let element" class="px-6 py-4 text-sm text-gray-500">{{ element.os.hostname }}</td>
      </ng-container>

      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
        <td mat-cell *matCellDef="let element" class="px-6 py-4 text-sm text-gray-500">{{ element.createdAt | date }}</td>
      </ng-container>

      <ng-container matColumnDef="expandedDetail">
        <td mat-cell *matCellDef="let element" [attr.colspan]="columnsToDisplay.length">
          <div
            class="example-element-detail flex-col px-6 py-4"
            [@detailExpand]="element == expandedElement ? 'expanded' : 'collapsed'"
          >
            <app-spec-card-list [asset]="element"></app-spec-card-list>

            <div class="flex lg:items-center my-4 justify-end gap-2">
              <button
                type="button"
                class="inline-flex items-center px-4 py-2.5 text-sm font-medium text-[#111827] bg-white border border-[#e8eaee] rounded-xl hover:bg-[#f8f9fb] focus:outline-none"
                (click)="remove(element._id)"
              >
                <mat-icon class="-ml-1 mr-2 h-5 w-5 text-gray-500" svgIcon="feather:trash"></mat-icon>
                Remove
              </button>
              <button
                type="button"
                class="inline-flex items-center px-4 py-2.5 text-sm font-medium text-white bg-[#111827] rounded-xl hover:bg-black focus:outline-none"
                (click)="addToPool(element._id)"
              >
                <mat-icon class="-ml-1 mr-2 h-5 w-5" svgIcon="heroicons_outline:plus"></mat-icon>
                Add to Pool
              </button>
            </div>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnsToDisplay"></tr>
      <tr
        mat-row
        *matRowDef="let element; columns: columnsToDisplay"
        class="example-element-row cursor-pointer"
        [class.example-expanded-row]="expandedElement === element"
        (click)="expandedElement = expandedElement === element ? null : element"
      ></tr>

      <tr mat-row *matRowDef="let row; columns: ['expandedDetail']" class="example-detail-row"></tr>
    </table>

    <mat-paginator
      class="z-10 dark:bg-transparent"
      [ngClass]="{ 'pointer-events-none': isLoading }"
      [length]="pagination.totalData"
      [pageIndex]="pagination.page"
      [pageSize]="pagination.limit"
      [pageSizeOptions]="[5, 10, 25, 100]"
      [showFirstLastButtons]="true"
    ></mat-paginator>
  </div>
</div>
