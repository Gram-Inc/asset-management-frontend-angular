<div class="px-8 pb-8 pt-2">
   <div class="ops-table">
      <ng-container *ngIf="users$ | async as users; else noUsers">
         <ng-container *ngIf="users.length > 0; else noUsers">
            <table class="min-w-full divide-y divide-gray-200">
               <thead>
                  <tr>
                     <th scope="col"
                        class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider ops-muted">
                        User
                     </th>
                     <th scope="col"
                        class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider ops-muted">
                        Email
                     </th>
                     <th scope="col"
                        class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider ops-muted">
                        Branch
                     </th>
                     <th scope="col"
                        class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider ops-muted">
                        Department
                     </th>
                     <th scope="col"
                        class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider ops-muted">
                        Role
                     </th>
                     <th scope="col" class="relative px-6 py-3">
                        <span class="sr-only">Edit</span>
                     </th>
                  </tr>
               </thead>
               <tbody class="bg-white divide-y divide-gray-200">
                  <ng-container *ngFor="let user of users; trackBy: trackByFn">
                     <tr class="cursor-pointer" [routerLink]="[user._id]">
                        <td class="px-6 py-4 whitespace-nowrap">
                           <div class="text-sm font-medium text-gray-900">{{ getUserName(user) }}</div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                           <div class="text-sm text-gray-900">{{ user.email }}</div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                           {{ getBranchShortCode(user.branch) }}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                           {{ getDepartmentCode(user) }}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                           <span class="ops-pill"
                              [ngClass]="{
                                 'ops-pill-info': user.role === 'level1',
                                 'ops-pill-warn': user.role === 'level2',
                                 'ops-pill-neutral': user.role === 'level3' || !user.role
                              }">
                              {{ user.role === 'level1' ? 'Level 1' : user.role === 'level2' ? 'Level 2' : 'Level 3' }}
                           </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                           <button type="button"
                              class="ml-2 inline-flex items-center px-2 py-1 text-sm font-medium text-gray-500 bg-white rounded-xl hover:bg-gray-50 hover:text-gray-900 focus:outline-none"
                              style="border: 1px solid #e8eaee"
                              matTooltip="Reset Password"
                              (click)="$event.stopPropagation();resetPassword(user)"
                              *ngIf="canEdit() | async">
                              <mat-icon class="h-4 w-4" svgIcon="heroicons_outline:key"></mat-icon>
                           </button>
                           <button type="button"
                              class="ml-2 inline-flex items-center px-2 py-1 text-sm font-medium text-gray-500 bg-white rounded-xl hover:bg-gray-50 hover:text-gray-900 focus:outline-none"
                              style="border: 1px solid #e8eaee"
                              matTooltip="Edit" (click)="$event.stopPropagation()"
                              [routerLink]="['edit/' + user._id]" *ngIf="canEdit() | async">
                              <mat-icon class="h-4 w-4" svgIcon="feather:edit"></mat-icon>
                           </button>
                        </td>
                     </tr>
                  </ng-container>
                  <tr>
                     <td colspan="6">
                        <mat-paginator class="z-10 dark:bg-transparent"
                           [ngClass]="{ 'pointer-events-none': isLoading }" [length]="pagination.totalData"
                           [pageIndex]="pagination.page" [pageSize]="pagination.limit"
                           [pageSizeOptions]="[5, 10, 25, 100]" [showFirstLastButtons]="true"></mat-paginator>
                     </td>
                  </tr>
               </tbody>
            </table>
         </ng-container>
      </ng-container>
      <ng-template #noUsers>
         <div class="p-10 text-sm text-center ops-muted">
            There are no users!
         </div>
      </ng-template>
   </div>
</div>
