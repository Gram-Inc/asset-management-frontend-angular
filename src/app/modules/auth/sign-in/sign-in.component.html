<div class="sign-in-page">
  <div class="sign-in-card">
    <img src="assets/logo/rikielR.svg" alt="Rikiel" width="36" height="36" />

    <div class="sign-in-title">Sign in</div>
    <div class="sign-in-sub">
      <span>Don't have an account?</span>
      <a [routerLink]="['/sign-up']">Sign up</a>
    </div>

    <form class="sign-in-form" [formGroup]="signInForm" #signInNgForm="ngForm">
      <mat-form-field class="w-full">
        <mat-label>Email address</mat-label>
        <input id="email" matInput [formControlName]="'email'" />
        <mat-error *ngIf="signInForm.get('email').hasError('required')">
          Email address is required
        </mat-error>
        <mat-error *ngIf="signInForm.get('email').hasError('email')">
          Please enter a valid email address
        </mat-error>
      </mat-form-field>

      <mat-form-field class="w-full">
        <mat-label>Password</mat-label>
        <input id="password" matInput type="password" [formControlName]="'password'" #passwordField />
        <button
          mat-icon-button
          type="button"
          (click)="
            passwordField.type === 'password'
              ? (passwordField.type = 'text')
              : (passwordField.type = 'password')
          "
          matSuffix>
          <mat-icon class="icon-size-4" *ngIf="passwordField.type === 'password'">visibility</mat-icon>
          <mat-icon class="icon-size-4" *ngIf="passwordField.type === 'text'">visibility_off</mat-icon>
        </button>
        <mat-error>Password is required</mat-error>
      </mat-form-field>

      <div class="sign-in-remember">
        <mat-checkbox [color]="'primary'" [formControlName]="'rememberMe'">Remember me</mat-checkbox>
      </div>

      <button
        type="button"
        class="sign-in-submit"
        [disabled]="signInForm.disabled"
        (click)="signIn()">
        <span *ngIf="!signInForm.disabled">Sign in</span>
        <mat-progress-spinner
          *ngIf="signInForm.disabled"
          class="sign-in-spinner"
          [diameter]="22"
          [mode]="'indeterminate'"
          [color]="'accent'">
        </mat-progress-spinner>
      </button>
    </form>
  </div>
</div>
