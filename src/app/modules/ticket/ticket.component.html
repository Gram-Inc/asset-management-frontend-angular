<div class="ticket-toolbar px-6 pt-6 pb-2">
   <div class="flex flex-wrap items-center gap-3 justify-between">
      <div class="flex items-center gap-3 flex-1 min-w-0">
         <span class="hidden sm:block">
            <app-user-filter></app-user-filter>
         </span>
         <mat-form-field class="ticket-search w-full max-w-xs" appearance="outline">
            <mat-label>Search</mat-label>
            <input matInput [formControl]="searchCtrl" />
         </mat-form-field>
      </div>
      <div class="flex items-center gap-2 shrink-0">
         <button type="button" class="ticket-btn ticket-btn-secondary" *ngIf="canExport() | async"
            (click)="exportCsv()">
            <mat-icon class="icon-size-5 mr-2" svgIcon="feather:download-cloud"></mat-icon>
            Export
         </button>
         <button type="button" class="ticket-btn ticket-btn-primary" [routerLink]="['create']"
            *ngIf="canCreate() | async">
            <mat-icon class="icon-size-5 mr-2" svgIcon="heroicons_outline:plus"></mat-icon>
            Create
         </button>
      </div>
   </div>
</div>
<ticket-list></ticket-list>
