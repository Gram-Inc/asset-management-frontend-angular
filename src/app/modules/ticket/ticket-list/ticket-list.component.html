<div style="display: block; padding: 24px">
   <div class="flex flex-col">
      <div class="-my-2 overflow-x-auto sm:-mx-6 lg:-mx-8">
         <div class="py-2 align-middle inline-block min-w-full sm:px-6 lg:px-8">
            <div class="ops-table">
               <ng-container *ngIf="tickets$ | async as tickets; else noTickets">
                  <ng-container *ngIf="tickets.length > 0; else noTickets">
                     <table class="min-w-full divide-y divide-gray-200">
                        <thead>
                           <tr>
                              <th scope="col"
                                 class="px-6 py-3 text-left text-xs font-medium ops-muted uppercase tracking-wider">
                                 Description
                              </th>
                              <th scope="col"
                                 class="px-6 py-3 text-left text-xs font-medium ops-muted uppercase tracking-wider">
                                 Priority
                              </th>
                              <th scope="col"
                                 class="px-6 py-3 text-left text-xs font-medium ops-muted uppercase tracking-wider">
                                 Category
                              </th>
                              <th scope="col"
                                 class="px-6 py-3 text-left text-xs font-medium ops-muted uppercase tracking-wider">
                                 Status
                              </th>
                           </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">
                           <ng-container *ngFor="let ticket of tickets; trackBy: trackByFn">
                              <tr class="cursor-pointer" [routerLink]="[ticket._id]">
                                 <td class="px-6 py-4 whitespace-nowrap" [matTooltip]="ticket.description">
                                    <div class="flex flex-col">
                                       <span class="text-xs ops-muted">
                                          {{ ticket.createdAt | date }}
                                       </span>
                                       <div class="text-sm font-medium break-words text-gray-900 truncate">
                                          {{ getTrimmedWork(ticket.description) }}
                                       </div>
                                    </div>
                                 </td>

                                 <td class="px-6 py-4 whitespace-nowrap">
                                    <span class="ops-pill" [ngClass]="{
                                          'ops-pill-ok': ticket.priority == 'Low',
                                          'ops-pill-neutral': ticket.priority == 'Medium',
                                          'ops-pill-warn': ticket.priority == 'High',
                                          'ops-pill-danger': ticket.priority == 'Critical'
                                       }">
                                       {{ ticket.priority | titlecase }}
                                    </span>
                                 </td>

                                 <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                    {{ ticket.category | titlecase }}
                                 </td>
                                 <td class="px-6 py-4 whitespace-nowrap">
                                    <span class="ops-pill" [ngClass]="{
                                          'ops-pill-info': ticket.callStatus === 'Open' || ticket.callStatus === 'Assigned',
                                          'ops-pill-warn': ticket.callStatus === 'In Progress' || ticket.callStatus === 'Hold',
                                          'ops-pill-neutral': ticket.callStatus === 'Vendor Dependency' || !ticket.callStatus,
                                          'ops-pill-ok': ticket.callStatus === 'Closed'
                                       }">
                                       {{ ticket.callStatus || 'Open' | titlecase }}
                                    </span>
                                 </td>
                              </tr>
                           </ng-container>
                           <tr>
                              <td colspan="4">
                                 <mat-paginator class="z-10 dark:bg-transparent"
                                    [ngClass]="{ 'pointer-events-none': isLoading }" [length]="pagination.totalData"
                                    [pageIndex]="pagination.page" [pageSize]="pagination.limit"
                                    [pageSizeOptions]="[5, 10, 25, 100]" [showFirstLastButtons]="true"></mat-paginator>
                              </td>
                           </tr>
                        </tbody>
                     </table>
                  </ng-container>
               </ng-container>
               <ng-template #noTickets>
                  <div class="p-10 border-t text-sm text-center ops-muted">
                     No tickets found
                  </div>
               </ng-template>
            </div>
         </div>
      </div>
   </div>
</div>
