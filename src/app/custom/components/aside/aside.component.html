<a class="side-link" [routerLink]="isDisabled ? null : [routerString]" [class.active]="active"
    [class.is-disabled]="isDisabled" [matTooltip]="name" [matTooltipDisabled]="!showTip" matTooltipPosition="right"
    (click)="isDisabled && $event.preventDefault()">
    <mat-icon *ngIf="svgIcon" [svgIcon]="svgIcon"></mat-icon>
    <span>{{ name }}</span>
</a>
