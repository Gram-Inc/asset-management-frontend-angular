<div *ngIf="user$ | async as user; else noUser" class="studio-shell">
   <mat-drawer-container class="main-container" autosize [hasBackdrop]="mode === 'over'">
      <mat-drawer #drawer class="sidenav" [class.wide]="showLabels" [mode]="mode" opened="true">
         <nav class="rail-nav" [class.labeled]="showLabels" aria-label="Primary">
            <app-aside [routerString]="'/dashboard'" *ngIf="checkLevel('level1') | async" [svgIcon]="'feather:home'"
               [name]="'Dashboard'" [showTip]="!showLabels"></app-aside>
            <app-aside [routerString]="'/home'" *ngIf="!(checkLevel('level1') | async)" [svgIcon]="'feather:home'"
               [name]="'Home'" [showTip]="!showLabels"></app-aside>

            <app-aside [routerString]="'/asset'" *ngIf="(checkAsset() | async) && !(checkLevel('level1') | async)"
               [svgIcon]="'feather:layers'" [name]="'Asset'" [showTip]="!showLabels"></app-aside>

            <ng-container *ngIf="(checkAsset() | async) && (checkLevel('level1') | async)">
               <button type="button" class="side-link" [class.active]="sectionActive('/asset')"
                  [matMenuTriggerFor]="assetMenu" matTooltip="Asset" [matTooltipDisabled]="showLabels"
                  matTooltipPosition="right" aria-label="Asset">
                  <mat-icon [svgIcon]="'feather:layers'"></mat-icon>
                  <span>Asset</span>
                  <mat-icon class="chevron" [svgIcon]="'heroicons_outline:chevron-right'"></mat-icon>
               </button>
               <mat-menu #assetMenu="matMenu" xPosition="after" panelClass="rail-menu">
                  <a mat-menu-item routerLink="/asset" [class.rail-on]="isAssetManage()">Manage</a>
                  <a mat-menu-item routerLink="/asset/scanned" [class.rail-on]="isAssetScanned()">Scanned</a>
               </mat-menu>
            </ng-container>

            <app-aside *ngIf="checkTicket() | async" [routerString]="'/ticket'" [svgIcon]="'heroicons_outline:ticket'"
               [name]="'Ticket'" [showTip]="!showLabels"></app-aside>

            <ng-container *ngIf="checkUAM() | async">
               <button type="button" class="side-link" [class.active]="sectionActive('/uam')"
                  [matMenuTriggerFor]="uamMenu" matTooltip="U.A.M" [matTooltipDisabled]="showLabels"
                  matTooltipPosition="right" aria-label="User access management">
                  <mat-icon [svgIcon]="'feather:file-text'"></mat-icon>
                  <span>U.A.M</span>
                  <mat-icon class="chevron" [svgIcon]="'heroicons_outline:chevron-right'"></mat-icon>
               </button>
               <mat-menu #uamMenu="matMenu" xPosition="after" panelClass="rail-menu">
                  <a mat-menu-item routerLink="/uam" [class.rail-on]="isUamManage()">Manage</a>
                  <a mat-menu-item *ngIf="canCreateUAM() | async" routerLink="/uam/create" [class.rail-on]="isUamCreate()">Create</a>
               </mat-menu>
            </ng-container>

            <app-aside *ngIf="checkAudit() | async" [routerString]="'/audit'"
               [svgIcon]="'heroicons_outline:clipboard-check'" [name]="'Audit'" [showTip]="!showLabels"></app-aside>

            <div class="rail-gap"
               *ngIf="(checkUser() | async) || (checkVendor() | async) || (checkBranch() | async) || (checkDepartment() | async)">
            </div>

            <app-aside *ngIf="checkUser() | async" [routerString]="'/user'" [svgIcon]="'feather:users'" [name]="'User'"
               [showTip]="!showLabels"></app-aside>
            <app-aside *ngIf="checkVendor() | async" [routerString]="'/vendor'"
               [svgIcon]="'heroicons_outline:identification'" [name]="'Vendor'" [showTip]="!showLabels"></app-aside>
            <app-aside *ngIf="checkBranch() | async" [routerString]="'/branch'"
               [svgIcon]="'heroicons_outline:office-building'" [name]="'Branch'" [showTip]="!showLabels"></app-aside>
            <app-aside *ngIf="checkDepartment() | async" [routerString]="'/department'"
               [svgIcon]="'heroicons_outline:user-group'" [name]="'Department'" [showTip]="!showLabels"></app-aside>

            <div class="rail-gap" *ngIf="(checkLevel('level1') | async) || (checkSetting() | async)"></div>

            <app-aside *ngIf="checkLevel('level1') | async" [routerString]="'/report'" [svgIcon]="'feather:activity'"
               [name]="'Report'" [showTip]="!showLabels"></app-aside>
            <app-aside *ngIf="checkSetting() | async" [routerString]="'/setting'" [svgIcon]="'feather:sliders'"
               [name]="'Setting'" [showTip]="!showLabels"></app-aside>

            <button *ngIf="mode === 'side'" type="button" class="side-link rail-toggle" (click)="toggleNav()"
               [attr.aria-label]="navExpanded ? 'Collapse navigation' : 'Expand navigation'">
               <mat-icon [svgIcon]="'heroicons_outline:view-boards'"></mat-icon>
               <span>{{ navExpanded ? 'Collapse' : 'Expand' }}</span>
            </button>
         </nav>
      </mat-drawer>

      <div class="content-canvas">
         <header class="studio-head">
            <button *ngIf="mode === 'over'" mat-icon-button type="button" (click)="toggleDrawer()" aria-label="Open navigation">
               <mat-icon class="topIcon" svgIcon="heroicons_outline:menu-alt-1"></mat-icon>
            </button>
            <span class="mark-well">
               <img class="mark" src="../assets/logo/rikielR.svg" alt="" width="22" height="22" />
            </span>
            <span class="head-rule" aria-hidden="true"></span>
            <h1 class="studio-title">{{ pageTitle }}</h1>
            <span class="toolbar-spacer"></span>
            <FullScreen [iconTpl]="icon" class="head-icon">
               <ng-template #icon>
                  <mat-icon class="topIcon" svgIcon="heroicons_outline:arrows-expand"></mat-icon>
               </ng-template>
            </FullScreen>
            <div class="who">
               <div class="who-copy">
                  <div class="who-name">{{ user.firstName }} {{ user.lastName }}</div>
                  <div class="who-mail">{{ user.email }}</div>
               </div>
               <user class="toolbar-action"></user>
            </div>
         </header>
         <app-loading-bar></app-loading-bar>
         <div class="content-scroll">
            <router-outlet *ngIf="user != null && user != undefined"></router-outlet>
         </div>
      </div>
   </mat-drawer-container>
</div>
<ng-template #noUser>
   <router-outlet></router-outlet>
</ng-template>
